---
- name: Verify self-built FMD Server
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the shared FMD Server verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

    - name: Assert FMD Server runs the self-built image
      ansible.builtin.assert:
        that:
          - "fmd_server_running_image == 'fmd-foss/fmd-server:v' ~ fmd_server_defaults.fmd_server_version"
        fail_msg: >-
          FMD Server runs {{ fmd_server_running_image }} instead of the self-built
          fmd-foss/fmd-server:v{{ fmd_server_defaults.fmd_server_version }}
        success_msg: "FMD Server runs the self-built {{ fmd_server_running_image }}"

    - name: Retrieve the FMD Server container image definition
      ansible.builtin.command:
        cmd: docker image inspect {{ fmd_server_running_image }}
      register: fmd_server_image_definition
      changed_when: false

    - name: Assert the FMD Server container image was built here rather than pulled
      # The point of this scenario is that the image is compiled from source. An
      # image that came off the registry carries a repository digest; one that
      # `docker build` produced locally does not.
      ansible.builtin.assert:
        that: "(fmd_server_image_definition.stdout | from_json | first).RepoDigests | length == 0"
        fail_msg: "{{ fmd_server_running_image }} carries a repository digest, so it was pulled rather than built"
        success_msg: "{{ fmd_server_running_image }} was built locally"

    - name: Retrieve the version FMD Server's source tree declares
      # The image was compiled from this checkout, and the shared verification
      # has already confirmed that the running binary reports the pinned
      # version. Reading it out of the source as well is what ties the two
      # together: it shows the role checked out the right revision, rather than
      # the build having happened to pick up something else.
      ansible.builtin.slurp:
        src: /{{ fmd_server_defaults.fmd_server_identifier }}/docker-src/version/version.go
      register: fmd_server_source_version_file

    - name: Assert the FMD Server source was checked out at the pinned version
      ansible.builtin.assert:
        that: "'\"' ~ fmd_server_defaults.fmd_server_version ~ '\"' in (fmd_server_source_version_file.content | b64decode)"
        fail_msg: >-
          The FMD Server source does not declare version {{ fmd_server_defaults.fmd_server_version }}:
          {{ fmd_server_source_version_file.content | b64decode | trim }}
        success_msg: "The FMD Server source declares version {{ fmd_server_defaults.fmd_server_version }}"
