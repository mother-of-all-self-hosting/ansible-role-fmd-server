---
- name: Verify FMD Server
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Run the shared FMD Server verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

    - name: Assert FMD Server runs the image published by upstream
      # This is the scenario that a Renovate version bump has to pass, so the
      # image must be the one the bumped variable names.
      ansible.builtin.assert:
        that:
          - >-
            fmd_server_running_image == fmd_server_defaults.fmd_server_container_image_registry_prefix_upstream_default
            ~ 'fmd-foss/fmd-server:' ~ fmd_server_defaults.fmd_server_version
        fail_msg: >-
          FMD Server runs {{ fmd_server_running_image }} instead of
          {{ fmd_server_defaults.fmd_server_container_image_registry_prefix_upstream_default }}fmd-foss/fmd-server:{{ fmd_server_defaults.fmd_server_version }}
        success_msg: "FMD Server runs {{ fmd_server_running_image }}"

    - name: Retrieve the FMD Server container image definition
      ansible.builtin.command:
        cmd: docker image inspect {{ fmd_server_running_image }}
      register: fmd_server_image_definition
      changed_when: false

    - name: Assert the FMD Server container image was pulled from the registry
      # A self-built image has no repository digest. Without this, the scenario
      # could not tell the pinned upstream image from one built on the spot.
      ansible.builtin.assert:
        that: "(fmd_server_image_definition.stdout | from_json | first).RepoDigests | length > 0"
        fail_msg: "{{ fmd_server_running_image }} carries no repository digest, so it was not pulled from a registry"
        success_msg: "{{ fmd_server_running_image }} was pulled from a registry"
