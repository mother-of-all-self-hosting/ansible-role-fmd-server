---
- name: Verify FMD Server
  hosts: all
  become: true
  gather_facts: false

  vars:
    fmd_server_verify_units:
      - findmydeviceserver.service

  tasks:
    - name: Verify that FMD Server works
      block:
        - name: Run the shared FMD Server verification
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        - name: Assert FMD Server runs the image published by upstream
          # This is the scenario that a Renovate version bump has to pass, so the
          # image must be the one the bumped variable names.
          ansible.builtin.assert:
            that:
              - >-
                fmd_server_running_image == fmd_server_defaults.fmd_server_container_image_registry_prefix_upstream_default
                ~ 'fmd-foss/fmd-server:' ~ fmd_server_defaults.fmd_server_version
            fail_msg: >-
              FMD Server runs {{ fmd_server_running_image }} instead of
              {{ fmd_server_defaults.fmd_server_container_image_registry_prefix_upstream_default }}fmd-foss/fmd-server:{{ fmd_server_defaults.fmd_server_version }}
            success_msg: "FMD Server runs {{ fmd_server_running_image }}"

        - name: Inspect the FMD Server image
          ansible.builtin.command:
            cmd: docker image inspect {{ fmd_server_running_image }}
          register: fmd_server_image_definition
          changed_when: false

        - name: Assert the FMD Server container image was pulled from the registry
          # A self-built image has no repository digest. Without this, the scenario
          # could not tell the pinned upstream image from one built on the spot.
          ansible.builtin.assert:
            that: "(fmd_server_image_definition.stdout | from_json | first).RepoDigests | length > 0"
            fail_msg: "{{ fmd_server_running_image }} carries no repository digest, so it was not pulled from a registry"
            success_msg: "{{ fmd_server_running_image }} was pulled from a registry"

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "fmd_server_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: fmd_server_restarts_before
              loop: "{{ fmd_server_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: fmd_server_restarts_after
              loop: "{{ fmd_server_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - fmd_server_restarts_after.results | map(attribute='status.NRestarts') | list == fmd_server_restarts_before.results | map(attribute='status.NRestarts') | list
                  - fmd_server_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in fmd_server_verify_units | zip(fmd_server_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in fmd_server_verify_units | zip(fmd_server_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in fmd_server_verify_units | zip(fmd_server_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the FMD Server verification summary
          ansible.builtin.debug:
            msg:
              - "FMD Server systemd: {% for unit, state in fmd_server_verify_units | zip(fmd_server_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "FMD Server restarts: {% for unit, restarts in fmd_server_verify_units | zip(fmd_server_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "FMD Server version: {{ fmd_server_version_reported.content | trim }}"
              - "FMD Server image: {{ fmd_server_running_image }}"
              - "FMD Server database: {{ fmd_server_database_host_path }}"
              - "FMD Server locations kept: {{ fmd_server_location_count.json.Data }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the FMD Server systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=findmydeviceserver.service
          register: fmd_server_service_log
          changed_when: false

        - name: Show the FMD Server systemd service log
          ansible.builtin.debug:
            var: fmd_server_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "FMD Server verification failed. The systemd service log is printed above."
